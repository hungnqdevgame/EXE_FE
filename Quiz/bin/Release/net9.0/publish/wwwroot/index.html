<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <base href="/" />
    
    <!-- Bootstrap và Font trước -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CSS của bạn PHẢI SAU Tailwind để override -->
    <link href="Quiz.styles.css" rel="stylesheet" />
    <link href="css/site.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    
    <link rel="icon" type="image/png" href="favicon.png" />
    
    <!-- QUAN TRỌNG: Thêm CSS inline này để chắc chắn override Tailwind -->
    <style>
        /* Override Tailwind - PHẢI có style inline này */
        body {
            padding-top: 80px !important;
            margin: 0 !important;
        }

        .header {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            z-index: 9999 !important;
            background: rgba(255, 255, 255, 0.98) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08) !important;
            display: block !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 70px !important;
            }
        }

        @media (max-width: 576px) {
            body {
                padding-top: 110px !important;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.fileHelper = {
            openFileDialog: function (elementId) {
                const input = document.getElementById(elementId);
                if (input) {
                    input.click();
                } else {
                    console.error(`Không tìm thấy phần tử có id: ${elementId}`);
                }
            }
        };
    </script>
</body>

</html>
